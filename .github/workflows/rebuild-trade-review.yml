name: Rebuild exchange review bundle

on:
  push:
    branches: [fix/trades-owned-only-beta-title-20261111]
    paths:
      - '.github/workflows/rebuild-trade-review.yml'
      - 'public/app.js'
      - 'public/index.html'
      - 'src/permanent-rewards.js'
      - 'test/trade-owned-options.test.js'
      - 'test/permanent-beta-title.test.js'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build and validate
        run: |
          npm run build:js
          npm run check:css
          npm run check:js
          npm run check:deploy
          node --test test/trade-owned-options.test.js test/permanent-beta-title.test.js
      - name: Commit only rebuilt JavaScript bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.min.js public/bot-studio.min.js
          if ! git diff --cached --quiet; then
            git commit -m "Synchroniser le JavaScript compressé des échanges"
            git push origin HEAD:fix/trades-owned-only-beta-title-20261111
          fi
