name: Préparer JS des échanges pour validation
on:
  push:
    branches: [fix/trades-only-owned-offers-20261111]
    paths:
      - '.github/workflows/sync-review-trade-assets.yml'
      - 'public/app.js'
      - 'public/index.html'
      - 'test/trade-owned-offers.test.js'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Build updated app bundle
        run: npm run build:js
      - name: Validate trade selector, bundles and preflight
        run: |
          npm run check:js
          npm run check:deploy
          node --test test/trade-owned-offers.test.js
      - name: Commit generated app.min.js only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.min.js
          if ! git diff --cached --quiet; then
            git commit -m "Synchroniser app.min.js pour le filtre des échanges"
            git push origin HEAD:fix/trades-only-owned-offers-20261111
          fi
