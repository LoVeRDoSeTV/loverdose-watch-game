name: Appliquer six badges WebP sur la branche de travail

on:
  push:
    branches: [performance-safe-modules-20261029]
    paths:
      - '.github/workflows/apply-badge-webp.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'LoVeRDoSeTV/loverdose-watch-game'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les outils
        run: |
          python -m pip install Pillow==11.3.0
          npm install --no-audit --no-fund
      - name: Optimiser seulement les six badges approuvés
        run: python scripts/apply-reviewed-badges.py
      - name: Tester le jeu
        run: npm test
      - name: Vérifier que seuls les six badges changent
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'public/badges/level-team-1.webp',
              'public/badges/eggs-2.webp',
              'public/badges/variety-1.webp',
              'public/badges/challenges-2.webp',
              'public/badges/eggs-3.webp',
              'public/badges/watch-global-4.webp',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed: raise SystemExit(f'Unexpected files: {changed ^ allowed}')
          print('Only approved six badges changed.')
          PY
      - name: Enregistrer uniquement sur la branche d'optimisation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/badges/*.webp
          git commit -m "Optimize six reviewed badge WebP assets"
          git push origin HEAD:performance-safe-modules-20261029
