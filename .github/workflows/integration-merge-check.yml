name: Valider et finaliser la fusion du jeu
on:
  push:
    branches:
      - integration/main-unification-20261111
permissions:
  contents: write
jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôler le code fusionné
        run: |
          node --check server.js
          node --check public/app.js
          node --check src/routes/pve.js
          grep -q 'BETA_TESTER_TITLE_KEY' server.js
          grep -q 'syncTradeAvailableOfferChoices' public/app.js
          grep -q 'grant_xp_boost_hours' server.js
      - name: Installer et reconstruire les ressources
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build:css
          npm run build:js
          npm run check:css
          npm run check:js
          npm run check:deploy
      - name: Exécuter tous les tests
        run: npm test
      - name: Supprimer les dépendances suivies par erreur sans modifier les sauvegardes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "integration/main-unification-20261111"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -f -q --cached --ignore-unmatch node_modules
          git rm -f --ignore-unmatch .github/workflows/integration-merge-check.yml
          git add -u
          if git diff --cached --name-only | grep -Ei '(^|/)(backup|backups|sauvegarde|sauvegardes)(/|$)|\\.(dump|bak|sql)$'; then
            echo "Erreur : des sauvegardes seraient modifiées"
            exit 1
          fi
          git diff --cached --check
          git commit -m "Nettoyer la fusion validée sans toucher aux sauvegardes [skip ci]"
          git push origin HEAD:refs/heads/integration/main-unification-20261111
