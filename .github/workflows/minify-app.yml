name: Maintenir les fichiers CSS et JavaScript compressés

on:
  push:
    branches: [performance-safe-modules-20261029]
    paths:
      - 'public/app.js'
      - 'public/bot-studio.js'
      - 'public/styles-extended.css'
      - 'public/pve-expansion.css'
      - 'public/return-summary.css'
      - 'public/live-xp-boost.css'
      - 'public/tablet.css'
      - 'public/lovys-evolution.css'
      - 'scripts/build-css.mjs'
      - 'scripts/build-js.mjs'
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'LoVeRDoSeTV/loverdose-watch-game'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Générer CSS et JavaScript allégés
        run: |
          npm run build:css
          npm run build:js
      - name: Vérifier bundles, sécurité des fichiers et tests
        run: |
          npm run check:css
          npm run check:js
          npm run check:deploy
          npm test
      - name: Publier uniquement les bundles générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.min.js public/bot-studio.min.js public/*.min.css
          if ! git diff --cached --quiet; then
            git commit -m "Synchroniser les CSS et JavaScript compressés"
            git push origin HEAD:performance-safe-modules-20261029
          fi
