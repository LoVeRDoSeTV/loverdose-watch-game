name: Vérifier et compiler le correctif du cadre 200 lives
on:
  push:
    branches:
      - fix/streak-200-avatar-preview-20261111
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Reconstruire et vérifier le JavaScript publié
        run: |
          npm run build:js
          npm run check:js
          npm run check:deploy
          node --check public/app.js
      - name: Valider les tests du jeu et l'aperçu doré
        run: npm test
      - name: Enregistrer le JavaScript compressé pour le déploiement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.min.js
          if ! git diff --cached --quiet; then
            git commit -m "Compiler la correction du cadre 200 lives [skip ci]"
            git push origin HEAD:refs/heads/fix/streak-200-avatar-preview-20261111
          fi
