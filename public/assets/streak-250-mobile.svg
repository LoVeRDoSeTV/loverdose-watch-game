<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" fill="none" aria-labelledby="title">
  <title id="title">250 lives — fond mobile sans bordure autour du médaillon</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="700" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#110e21"/><stop offset=".56" stop-color="#271442"/><stop offset="1" stop-color="#311c36"/></linearGradient>
    <linearGradient id="gold" x1="651" y1="385" x2="1164" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#a96f31"/><stop offset=".5" stop-color="#ffe7a2"/><stop offset="1" stop-color="#c98f42"/></linearGradient>
