<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoVeR Watch Game · Alerte drop OBS</title>
<style>
:root{--accent:#b886ff;--light:#f5ddff;--glow:rgba(160,85,255,.65)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
#alert{position:absolute;left:50%;bottom:10%;width:min(560px,88%);text-align:center;color:#fff;pointer-events:none;opacity:0;transform:translate(-50%,30px)}
#alert.show{opacity:1;animation:scene 8.5s both}
#alert[data-reward="cash"]{--accent:#f8c94b;--light:#fff0a8;--glow:rgba(255,202,57,.64)}
#alert[data-reward="fragments"]{--accent:#6be6e0;--light:#b8ffff;--glow:rgba(60,223,225,.6)}
#alert[data-reward="xp"]{--accent:#8be58f;--light:#dcffb9;--glow:rgba(105,231,116,.63)}
#alert[data-reward="egg"]{--accent:#d9a5ff;--light:#ffecff;--glow:rgba(206,127,255,.72)}
#alert[data-reward="egg"] .crate{filter:drop-shadow(0 0 32px var(--glow))}
.smoke{position:absolute;left:50%;bottom:80px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,rgba(190,160,255,.72),rgba(135,95,210,.16) 66%,transparent 72%);opacity:0}
.show .smoke:nth-child(1){animation:smoke-left 2.2s .55s ease-out both}
.show .smoke:nth-child(2){animation:smoke-right 2.6s .65s ease-out both}
.show .smoke:nth-child(3){animation:smoke-up 2.5s .7s ease-out both}
.crate{position:relative;z-index:2;margin:0 auto -6px;width:108px;height:94px;display:grid;place-items:center;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.show .crate{animation:fall .85s cubic-bezier(.2,.8,.45,1.13) both}
.crate:before{content:"";position:absolute;inset:12px 10px 4px;clip-path:polygon(15% 0,85% 0,100% 20%,100% 86%,85% 100%,15% 100%,0 86%,0 20%);background:linear-gradient(145deg,#685296,#24173e 58%,#120e25);border:3px solid var(--accent);box-shadow:inset 0 0 18px var(--glow),0 0 22px var(--glow)}
.crate:after{content:"";position:absolute;top:5px;width:98px;height:22px;border:3px solid var(--accent);border-radius:5px;background:linear-gradient(#8467ad,#372551);box-shadow:0 0 18px var(--glow)}
.icon{position:relative;z-index:1;margin-top:22px;font-size:43px;line-height:1}
.show .icon{animation:reveal 1s .8s both}
.card{position:relative;z-index:3;padding:15px 23px 17px;border:2px solid var(--accent);border-radius:20px;background:linear-gradient(135deg,rgba(24,13,52,.97),rgba(53,24,94,.96));box-shadow:0 0 34px var(--glow)}
.show .card{animation:card-in .55s .65s both}
.eyebrow{display:block;color:var(--light);font-weight:800;font-size:16px;letter-spacing:.13em;text-transform:uppercase}
#reward{display:block;margin-top:4px;color:#fff;font-size:28px;font-weight:900;line-height:1.15;text-shadow:0 0 14px var(--glow)}
#instruction{display:block;margin-top:8px;font-size:19px;font-weight:700}
.show .card:after{content:"";position:absolute;inset:-5px;border:2px solid var(--accent);border-radius:24px;animation:pulse 1s 1.1s ease-out both;pointer-events:none}
@keyframes scene{0%{opacity:0}5%,85%{opacity:1}100%{opacity:0}}
@keyframes fall{0%{transform:translateY(-90vh) rotate(-15deg)}75%{transform:translateY(11px) rotate(4deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes card-in{0%{transform:translateY(18px) scale(.85);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes reveal{0%,40%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes smoke-left{0%{opacity:0;transform:translate(-50%,0) scale(.3)}35%{opacity:.8}100%{opacity:0;transform:translate(-220%,-55px) scale(2.8)}}
@keyframes smoke-right{0%{opacity:0;transform:translate(-50%,0) scale(.3)}35%{opacity:.8}100%{opacity:0;transform:translate(120%,-85px) scale(3)}}
@keyframes smoke-up{0%{opacity:0;transform:translate(-50%,0) scale(.4)}35%{opacity:.7}100%{opacity:0;transform:translate(-50%,-180px) scale(3.2)}}
@keyframes pulse{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.1)}}
</style>
</head>
<body>
<div id="alert" role="status" aria-live="polite" data-reward="cash">
  <i class="smoke"></i><i class="smoke"></i><i class="smoke"></i>
  <div class="crate"><span class="icon" id="icon">💰</span></div>
  <div class="card"><span class="eyebrow">🎁 Largage en cours</span><strong id="reward">LoVeR’Cash</strong><span id="instruction">Tape !catch dans le chat</span></div>
</div>
<script>
(() => {
  const variants={
    cash:{icon:'💰',notes:[392,494,659,784]},
    fragments:{icon:'🧩',notes:[440,587,698,880]},
    xp:{icon:'🧪',notes:[523,659,784,1047]},
    egg:{icon:'🥚',notes:[392,587,784,1175]}
  };
  const alert=document.getElementById('alert');
  let lastId=null,initialized=false,timeoutId=0,audio=null,polling=false;
  function chime(kind){
    try{
      const AudioContext=window.AudioContext||window.webkitAudioContext;
      if(!AudioContext)return;
      audio ||= new AudioContext();
      audio.resume().catch(()=>{});
      const start=audio.currentTime+.04;
      variants[kind].notes.forEach((frequency,index)=>{
        const oscillator=audio.createOscillator(),gain=audio.createGain(),at=start+index*.15;
        oscillator.type=kind==='egg'?'triangle':'sine';
        oscillator.frequency.setValueAtTime(frequency,at);
        gain.gain.setValueAtTime(.0001,at);
        gain.gain.exponentialRampToValueAtTime(.15,at+.025);
        gain.gain.exponentialRampToValueAtTime(.0001,at+.38);
        oscillator.connect(gain).connect(audio.destination);
        oscillator.start(at);oscillator.stop(at+.4);
      });
    }catch(error){console.warn('Son de drop indisponible',error);}
  }
  function play(drop,withSound=true){
    const kind=Object.hasOwn(variants,drop.rewardKey)?drop.rewardKey:'cash';
    alert.classList.remove('show');
    void alert.offsetWidth;
    alert.dataset.reward=kind;
    document.getElementById('icon').textContent=variants[kind].icon;
    document.getElementById('reward').textContent=drop.reward||'Récompense surprise';
    alert.classList.add('show');
    clearTimeout(timeoutId);
    timeoutId=setTimeout(()=>alert.classList.remove('show'),8500);
    if(withSound)chime(kind);
  }
  async function poll(){
    if(polling)return;
    polling=true;
    try{
      const response=await fetch('/api/game-bot/drop-alert',{cache:'no-store'});
      if(!response.ok)return;
      const {drop}=await response.json();
      if(!initialized){initialized=true;lastId=drop?.id||null;return;}
      if(!drop||drop.id===lastId)return;
      lastId=drop.id;
      if(Date.now()-Date.parse(drop.startedAt)>15000)return;
      play(drop);
    }catch(error){console.warn('Alerte drop indisponible',error);}
    finally{polling=false;}
  }
  const test=new URLSearchParams(location.search).get('test');
  if(Object.hasOwn(variants,test)){
    play({rewardKey:test,reward:{cash:'3 à 25 LoVeR’Cash',fragments:'2 fragments d’œuf',xp:'Une bouteille de 100 XP',egg:'Un œuf mystère'}[test]},false);
  }else{
    poll();
    setInterval(poll,1500);
  }
})();
</script>
</body>
</html>
